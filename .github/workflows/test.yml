name: Vérification du respect des spécifications

on:
  push:

# NOTE: if you need to debug these things locally, use `act` and medium installation:
# E.g:
# `act push` or `act push --container-architecture linux/amd64` (Mac M1)
#
# Installation notes at https://github.com/nektos/act
#
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
      with:
        version-file: .tool-versions
        version-type: strict
    - id: python-version
      run: echo "version=$(grep '^python' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ steps.python-version.outputs.version }}

    - name: Installation des dépendances Python
      run: |
        pip install uv
        uv sync

    - name: Vérification du schéma statique
      run: |
        uv run frictionless validate --type schema statique/schema-statique.json
        uv run frictionless validate datapackage.json

    - name: Vérification du schéma dynamique
      run: |
        uv run frictionless validate --type schema dynamique/schema-dynamique.json

    - name: Vérification du schéma statique-tarifs
      run: |
        uv run frictionless validate --type schema statique-tarifs/schema-statique-tarifs.json

    - name: Vérification de l'absence de liens cassés
      run: elixir checks.exs

    - name: Tests ExUnit
      run: elixir test/test_helper.exs
